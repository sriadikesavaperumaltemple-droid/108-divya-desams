name: Render carousel images
on:
  push:
    paths:
      - 'assets/**/*.svg'
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick
      - name: Render SVGs to JPEGs
        run: |
          shopt -s nullglob
          for f in assets/*.svg; do
            base="${f%.svg}"
            rsvg-convert -w 1080 -h 1350 -o "${base}.png" "$f"
            magick "${base}.png" -background white -alpha remove -alpha off -quality 90 "${base}.jpg"
            rm "${base}.png"
          done
      - name: Commit JPEGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Render Divya Desam carousel JPEGs"
          git push
