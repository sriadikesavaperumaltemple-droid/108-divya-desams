<text x="540" y="120" text-anchor="middle" font-family="Noto Sans Tamil, sans-serif" font-size="50" font-weight="700" fill="#6b1528">திவ்ய தேசங்கள் • 49–52</text><text x="540" y="168" text-anchor="middle" font-family="Noto Sans Tamil, sans-serif" font-size="25" fill="#6b4b2b">தொண்டைநாடு</text><rect x="75" y="205" width="930" height="250" rx="20" fill="#fffaf0" stroke="#d1a052" stroke-width="3"/><circle cx="122" cy="248" r="31" fill="#70182b"/><text x="122" y="259" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#ffe5a9">49</text><text x="175" y="247" font-family="Noto Sans Tamil, sans-serif" font-size="31" font-weight="700" fill="#721829">நிலாத்திங்கள் துண்டம்</text><text x="175" y="296" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">பெருமாள் : நிலாத்திங்கள் துண்டத்தான்</text><text x="175" y="337" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">தாயார் : சந்திரசூடவல்லி</text><text x="175" y="380" font-family="Noto Sans Tamil, sans-serif" font-size="21" fill="#594832">இடம் : Kanchipuram • Kanchipuram • Tamil Nadu</text><text x="175" y="419" font-family="Noto Sans Tamil, sans-serif" font-size="19" fill="#8a6236">தொண்டைநாடு</text><rect x="75" y="469" width="930" height="250" rx="20" fill="#fffaf0" stroke="#d1a052" stroke-width="3"/><circle cx="122" cy="512" r="31" fill="#70182b"/><text x="122" y="523" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#ffe5a9">50</text><text x="175" y="511" font-family="Noto Sans Tamil, sans-serif" font-size="31" font-weight="700" fill="#721829">திருஊரகம்</text><text x="175" y="560" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">பெருமாள் : உலகளந்த பெருமாள்</text><text x="175" y="601" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">தாயார் : அமுதவல்லி</text><text x="175" y="644" font-family="Noto Sans Tamil, sans-serif" font-size="21" fill="#594832">இடம் : Kanchipuram • Kanchipuram • Tamil Nadu</text><text x="175" y="683" font-family="Noto Sans Tamil, sans-serif" font-size="19" fill="#8a6236">தொண்டைநாடு</text><rect x="75" y="733" width="930" height="250" rx="20" fill="#fffaf0" stroke="#d1a052" stroke-width="3"/><circle cx="122" cy="776" r="31" fill="#70182b"/><text x="122" y="787" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#ffe5a9">51</text><text x="175" y="775" font-family="Noto Sans Tamil, sans-serif" font-size="31" font-weight="700" fill="#721829">திருவெக்கா</text><text x="175" y="824" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">பெருமாள் : யதோத்தகாரி பெருமாள்</text><text x="175" y="865" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">தாயார் : கோமளவல்லி</text><text x="175" y="908" font-family="Noto Sans Tamil, sans-serif" font-size="21" fill="#594832">இடம் : Kanchipuram • Kanchipuram • Tamil Nadu</text><text x="175" y="947" font-family="Noto Sans Tamil, sans-serif" font-size="19" fill="#8a6236">தொண்டைநாடு</text><rect x="75" y="997" width="930" height="250" rx="20" fill="#fffaf0" stroke="#d1a052" stroke-width="3"/><circle cx="122" cy="1040" r="31" fill="#70182b"/><text x="122" y="1051" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#ffe5a9">52</text><text x="175" y="1039" font-family="Noto Sans Tamil, sans-serif" font-size="31" font-weight="700" fill="#721829">திருக்காரகம்</text><text x="175" y="1088" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">பெருமாள் : கருணாகர பெருமாள்</text><text x="175" y="1129" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">தாயார் : பத்மாமணி</text><text x="175" y="1172" font-family="Noto Sans Tamil, sans-serif" font-size="21" fill="#594832">இடம் : Kanchipuram • Kanchipuram • Tamil Nadu</text><text x="175" y="1211" font-family="Noto Sans Tamil, sans-serif" font-size="19" fill="#8a6236">தொண்டைநாடு</text><text x="540" y="1290" text-anchor="middle" font-family="Noto Sans Tamil, sans-serif" font-size="23" font-weight="700" fill="#70182b">ஆழ்வார்கள் திருவடிகளே சரணம்</text></svg>