<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#641022"/><stop offset="0.5" stop-color="#9b5b28"/><stop offset="1" stop-color="#3f0d1a"/></linearGradient></defs>
<rect width="1080" height="1350" fill="url(#g)"/><rect x="38" y="38" width="1004" height="1274" rx="34" fill="#f7efd9" stroke="#d6a34a" stroke-width="8"/>
<text x="540" y="120" text-anchor="middle" font-family="Noto Sans Tamil, sans-serif" font-size="50" font-weight="700" fill="#6b1528">திவ்ய தேசங்கள் • 33–36</text><text x="540" y="168" text-anchor="middle" font-family="Noto Sans Tamil, sans-serif" font-size="25" fill="#6b4b2b">சோழநாடு</text><rect x="75" y="205" width="930" height="250" rx="20" fill="#fffaf0" stroke="#d1a052" stroke-width="3"/><circle cx="122" cy="248" r="31" fill="#70182b"/><text x="122" y="259" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#ffe5a9">33</text><text x="175" y="247" font-family="Noto Sans Tamil, sans-serif" font-size="31" font-weight="700" fill="#721829">திருவைகுண்ட விண்ணகரம்</text><text x="175" y="296" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">பெருமாள் : வைகுண்டநாதர்</text><text x="175" y="337" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">தாயார் : வைகுண்டவல்லி</text><text x="175" y="380" font-family="Noto Sans Tamil, sans-serif" font-size="21" fill="#594832">இடம் : Thirunangur • Mayiladuthurai • Tamil Nadu</text><text x="175" y="419" font-family="Noto Sans Tamil, sans-serif" font-size="19" fill="#8a6236">சோழநாடு</text><rect x="75" y="469" width="930" height="250" rx="20" fill="#fffaf0" stroke="#d1a052" stroke-width="3"/><circle cx="122" cy="512" r="31" fill="#70182b"/><text x="122" y="523" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#ffe5a9">34</text><text x="175" y="511" font-family="Noto Sans Tamil, sans-serif" font-size="31" font-weight="700" fill="#721829">திருவாலி – திருநகரி</text><text x="175" y="560" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">பெருமாள் : லட்சுமி நரசிம்மர்</text><text x="175" y="601" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">தாயார் : அமிர்தகடவல்லி</text><text x="175" y="644" font-family="Noto Sans Tamil, sans-serif" font-size="21" fill="#594832">இடம் : Thiruvallai / Thirunagari • Mayiladuthurai • Tamil Nadu</text><text x="175" y="683" font-family="Noto Sans Tamil, sans-serif" font-size="19" fill="#8a6236">சோழநாடு</text><rect x="75" y="733" width="930" height="250" rx="20" fill="#fffaf0" stroke="#d1a052" stroke-width="3"/><circle cx="122" cy="776" r="31" fill="#70182b"/><text x="122" y="787" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#ffe5a9">35</text><text x="175" y="775" font-family="Noto Sans Tamil, sans-serif" font-size="31" font-weight="700" fill="#721829">திருத்தேவனார்தொகை</text><text x="175" y="824" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">பெருமாள் : தேவநாயகன்</text><text x="175" y="865" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">தாயார் : சமுத்திரநாயகி</text><text x="175" y="908" font-family="Noto Sans Tamil, sans-serif" font-size="21" fill="#594832">இடம் : Thirunangur • Mayiladuthurai • Tamil Nadu</text><text x="175" y="947" font-family="Noto Sans Tamil, sans-serif" font-size="19" fill="#8a6236">சோழநாடு</text><rect x="75" y="997" width="930" height="250" rx="20" fill="#fffaf0" stroke="#d1a052" stroke-width="3"/><circle cx="122" cy="1040" r="31" fill="#70182b"/><text x="122" y="1051" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#ffe5a9">36</text><text x="175" y="1039" font-family="Noto Sans Tamil, sans-serif" font-size="31" font-weight="700" fill="#721829">திருத்தெற்றியம்பலம்</text><text x="175" y="1088" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">பெருமாள் : செங்கண்மால் / ரங்கநாதர்</text><text x="175" y="1129" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">தாயார் : செங்கமலவல்லி</text><text x="175" y="1172" font-family="Noto Sans Tamil, sans-serif" font-size="21" fill="#594832">இடம் : Thirunangur • Mayiladuthurai • Tamil Nadu</text><text x="175" y="1211" font-family="Noto Sans Tamil, sans-serif" font-size="19" fill="#8a6236">சோழநாடு</text><text x="540" y="1290" text-anchor="middle" font-family="Noto Sans Tamil, sans-serif" font-size="23" font-weight="700" fill="#70182b">ஆழ்வார்கள் திருவடிகளே சரணம்</text></svg>