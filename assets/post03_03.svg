<text x="540" y="120" text-anchor="middle" font-family="Noto Sans Tamil, sans-serif" font-size="50" font-weight="700" fill="#6b1528">திவ்ய தேசங்கள் • 77–80</text><text x="540" y="168" text-anchor="middle" font-family="Noto Sans Tamil, sans-serif" font-size="25" fill="#6b4b2b">மலைநாடு</text><rect x="75" y="205" width="930" height="250" rx="20" fill="#fffaf0" stroke="#d1a052" stroke-width="3"/><circle cx="122" cy="248" r="31" fill="#70182b"/><text x="122" y="259" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#ffe5a9">77</text><text x="175" y="247" font-family="Noto Sans Tamil, sans-serif" font-size="31" font-weight="700" fill="#721829">திருவித்துவக்கோடு</text><text x="175" y="296" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">பெருமாள் : அபயப்ரதன் / உய்யவந்த பெருமாள்</text><text x="175" y="337" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">தாயார் : வித்துவக்கோட்டு வல்லி</text><text x="175" y="380" font-family="Noto Sans Tamil, sans-serif" font-size="21" fill="#594832">இடம் : Thiruvithuvakodu • Palakkad • Kerala</text><text x="175" y="419" font-family="Noto Sans Tamil, sans-serif" font-size="19" fill="#8a6236">மலைநாடு</text><rect x="75" y="469" width="930" height="250" rx="20" fill="#fffaf0" stroke="#d1a052" stroke-width="3"/><circle cx="122" cy="512" r="31" fill="#70182b"/><text x="122" y="523" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#ffe5a9">78</text><text x="175" y="511" font-family="Noto Sans Tamil, sans-serif" font-size="31" font-weight="700" fill="#721829">திருக்காட்கரை</text><text x="175" y="560" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">பெருமாள் : காட்கர சுவாமி</text><text x="175" y="601" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">தாயார் : பெருஞ்செல்வ நாயகி</text><text x="175" y="644" font-family="Noto Sans Tamil, sans-serif" font-size="21" fill="#594832">இடம் : Thrikkakara • Ernakulam • Kerala</text><text x="175" y="683" font-family="Noto Sans Tamil, sans-serif" font-size="19" fill="#8a6236">மலைநாடு</text><rect x="75" y="733" width="930" height="250" rx="20" fill="#fffaf0" stroke="#d1a052" stroke-width="3"/><circle cx="122" cy="776" r="31" fill="#70182b"/><text x="122" y="787" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#ffe5a9">79</text><text x="175" y="775" font-family="Noto Sans Tamil, sans-serif" font-size="31" font-weight="700" fill="#721829">திருமூழிக்கலம்</text><text x="175" y="824" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">பெருமாள் : திருமூழிக்கலத்தான்</text><text x="175" y="865" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">தாயார் : மதுரவேணி நாச்சியார்</text><text x="175" y="908" font-family="Noto Sans Tamil, sans-serif" font-size="21" fill="#594832">இடம் : Thirumoozhikulam • Ernakulam • Kerala</text><text x="175" y="947" font-family="Noto Sans Tamil, sans-serif" font-size="19" fill="#8a6236">மலைநாடு</text><rect x="75" y="997" width="930" height="250" rx="20" fill="#fffaf0" stroke="#d1a052" stroke-width="3"/><circle cx="122" cy="1040" r="31" fill="#70182b"/><text x="122" y="1051" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#ffe5a9">80</text><text x="175" y="1039" font-family="Noto Sans Tamil, sans-serif" font-size="31" font-weight="700" fill="#721829">திருவல்லவாழ்</text><text x="175" y="1088" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">பெருமாள் : கோலப்பிரான் / ஸ்ரீவல்லபன்</text><text x="175" y="1129" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">தாயார் : வத்சல்யவல்லி</text><text x="175" y="1172" font-family="Noto Sans Tamil, sans-serif" font-size="21" fill="#594832">இடம் : Thiruvalla • Pathanamthitta • Kerala</text><text x="175" y="1211" font-family="Noto Sans Tamil, sans-serif" fon