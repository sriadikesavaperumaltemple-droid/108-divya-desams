<text x="540" y="120" text-anchor="middle" font-family="Noto Sans Tamil, sans-serif" font-size="50" font-weight="700" fill="#6b1528">திவ்ய தேசங்கள் • 65–68</text><text x="540" y="168" text-anchor="middle" font-family="Noto Sans Tamil, sans-serif" font-size="25" fill="#6b4b2b">வடநாடு</text><rect x="75" y="205" width="930" height="250" rx="20" fill="#fffaf0" stroke="#d1a052" stroke-width="3"/><circle cx="122" cy="248" r="31" fill="#70182b"/><text x="122" y="259" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#ffe5a9">65</text><text x="175" y="247" font-family="Noto Sans Tamil, sans-serif" font-size="31" font-weight="700" fill="#721829">திருஅயோத்தி</text><text x="175" y="296" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">பெருமாள் : ஸ்ரீ ராமர் / சக்கரவர்த்தித் திருமகன்</text><text x="175" y="337" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">தாயார் : சீதாதேவி</text><text x="175" y="380" font-family="Noto Sans Tamil, sans-serif" font-size="21" fill="#594832">இடம் : Ayodhya • Ayodhya • Uttar Pradesh</text><text x="175" y="419" font-family="Noto Sans Tamil, sans-serif" font-size="19" fill="#8a6236">வடநாடு</text><rect x="75" y="469" width="930" height="250" rx="20" fill="#fffaf0" stroke="#d1a052" stroke-width="3"/><circle cx="122" cy="512" r="31" fill="#70182b"/><text x="122" y="523" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#ffe5a9">66</text><text x="175" y="511" font-family="Noto Sans Tamil, sans-serif" font-size="31" font-weight="700" fill="#721829">திருநைமிசாரண்யம்</text><text x="175" y="560" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">பெருமாள் : தேவராஜ பெருமாள்</text><text x="175" y="601" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">தாயார் : ஸ்ரீஹரி லட்சுமி</text><text x="175" y="644" font-family="Noto Sans Tamil, sans-serif" font-size="21" fill="#594832">இடம் : Naimisaranya • Sitapur • Uttar Pradesh</text><text x="175" y="683" font-family="Noto Sans Tamil, sans-serif" font-size="19" fill="#8a6236">வடநாடு</text><rect x="75" y="733" width="930" height="250" rx="20" fill="#fffaf0" stroke="#d1a052" stroke-width="3"/><circle cx="122" cy="776" r="31" fill="#70182b"/><text x="122" y="787" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#ffe5a9">67</text><text x="175" y="775" font-family="Noto Sans Tamil, sans-serif" font-size="31" font-weight="700" fill="#721829">திருப்பிருதி</text><text x="175" y="824" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">பெருமாள் : பரமபுருஷன்</text><text x="175" y="865" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">தாயார் : பரிமளவல்லி நாச்சியார்</text><text x="175" y="908" font-family="Noto Sans Tamil, sans-serif" font-size="21" fill="#594832">இடம் : Joshimath • Chamoli • Uttarakhand</text><text x="175" y="947" font-family="Noto Sans Tamil, sans-serif" font-size="19" fill="#8a6236">வடநாடு</text><rect x="75" y="997" width="930" height="250" rx="20" fill="#fffaf0" stroke="#d1a052" stroke-width="3"/><circle cx="122" cy="1040" r="31" fill="#70182b"/><text x="122" y="1051" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#ffe5a9">68</text><text x="175" y="1039" font-family="Noto Sans Tamil, sans-serif" font-size="31" font-weight="700" fill="#721829">திருக்கண்டம் எனும் கடிநகர்</text><text x="175" y="1088" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">பெருமாள் : நீலமேக பெருமாள் / புருஷோத்தமன்</text><text x="175" y="1129" font-family="Noto Sans Tamil, sans-serif" font-size="23" fill="#594832">தாயார் : புண்டரீகவல்லி</text><text x="175" y="1172" font-family="Noto Sans Tamil, sans-serif" font-size="21" fill="#594832">இடம் : Devprayag • Tehri Garhwal • Uttarakhand</text><text x="175" y="1211" font-family="Noto Sans Tamil, sans-serif" font-size="19" fill="#8a6236">வடநாடு</text><text x="540" y="1290" text-anchor="middle" font-family="Noto Sans Tamil, sans-serif" font-size="23" font-weight="700" fill="#70182b">ஆழ்வார்கள் திருவடிகளே சரணம்</text></svg>